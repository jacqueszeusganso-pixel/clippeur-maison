<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable · Clippeur maison</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0A0A0B;--ink:#F4F1EA;--muted:#97948C;--accent:#FF4322}
  *{margin:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:"Hanken Grotesk",system-ui,sans-serif;
    min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
  .code{font-family:"Bricolage Grotesque";font-weight:800;font-size:clamp(5rem,20vw,11rem);
    line-height:1;letter-spacing:-.04em}
  .code em{font-style:normal;color:var(--accent)}
  h1{font-family:"Bricolage Grotesque";font-weight:700;font-size:1.5rem;margin:14px 0 10px;letter-spacing:-.02em}
  p{color:var(--muted);margin-bottom:28px}
  a{display:inline-flex;gap:8px;background:var(--accent);color:var(--bg);font-weight:600;
    text-decoration:none;padding:12px 22px;border-radius:999px}
</style>
</head>
<body>
  <div>
    <div class="code">4<em>0</em>4</div>
    <h1>Ce short n'existe pas.</h1>
    <p>La page que tu cherches a été coupée au montage.</p>
    <a href="/">← Retour à l'accueil</a>
  </div>
</body>
</html>
